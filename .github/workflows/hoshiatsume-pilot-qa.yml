name: Hoshiatsume pilot QA
on:
  push:
    branches:
      - refactor/hoshiatsume-one-stage-20261124
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve isolated checkout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hoshi-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/okinawa-hoshiatsume/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run pilot regression tests
        run: npx playwright test qa/hoshiatsume-pilot.spec.mjs --workers=1 --reporter=html --trace=retain-on-failure
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hoshiatsume-pilot-qa
          path: |
            playwright-report/
            test-results/
            /tmp/hoshi-http.log
          retention-days: 7
