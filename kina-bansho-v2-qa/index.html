<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#f5e8d1"><title>喜名番所 おしごと大作戦！3D 検証版</title>
<style>
*{box-sizing:border-box} :root{--app-height:100dvh}body{margin:0;background:#e5e0cc;color:#493e30;font-family:system-ui,sans-serif}main{max-width:640px;margin:auto;min-height:var(--app-height);background:#fff8e9;padding:max(5px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:4px}header{display:flex;align-items:center;justify-content:space-between;gap:4px}button,a.action,select{font:inherit;min-height:44px;min-width:44px;color:#493e30;background:#f2e6cb;border:1px solid #b8a88b;border-radius:10px;padding:5px 8px;cursor:pointer}a.action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}button.primary{background:#477451;color:white;border-color:#477451}button:disabled{opacity:.5}button.hint{outline:2px solid #ce932b;outline-offset:-3px}h1{font-size:clamp(17px,4.7vw,26px);margin:4px 0;text-align:center}h2{margin:0;font-size:20px}p{line-height:1.5} [hidden]{display:none!important}#intro,#result{padding:12px;display:grid;gap:12px;align-content:start}#intro p,#result p{margin:0}#intro label{display:grid;gap:4px}#intro select{width:100%}#play{display:grid;gap:4px;grid-template-rows:auto auto minmax(100px,1fr) auto auto auto auto;min-height:0;flex:1}#hud{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px}#hud span{background:#f1e6cd;border-radius:6px;padding:4px;white-space:nowrap}#goalRow{display:flex;align-items:center;gap:4px;font-size:12px}#progress{flex:1;min-width:35px;height:8px;accent-color:#477451}#world{position:relative;width:100%;height:clamp(100px,calc(var(--app-height) - 375px),340px);background:#c9dfd0;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:pan-y pinch-zoom}#marker{position:absolute;top:4px;left:4px;background:#fff8e9e8;border-radius:6px;padding:4px;pointer-events:none;font-size:12px}.fallback{margin:35px 8px 8px;text-align:center}#queueRow{display:flex;align-items:center;gap:4px;font-size:12px}#queue{display:flex;gap:3px;flex:1;min-height:32px;min-width:0}.guestCard{display:flex;flex-direction:column;background:#fff;border-radius:5px;padding:2px;flex:1;min-width:0;font-size:11px;text-align:center}.guestCard progress{width:100%;height:6px;accent-color:#75945f}#message{margin:0;min-height:34px;background:#fff;border-radius:8px;padding:5px;font-size:12px;line-height:1.35}#controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}#controls button{font-size:14px}#assist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}#assist button{font-size:13px}#version{font-size:10px;text-align:center}dialog{border:0;border-radius:15px;background:#fff8e9;color:#493e30;width:min(92vw,480px);max-height:calc(var(--app-height) - 24px);padding:12px}dialog[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}dialog::backdrop{background:#0009}.reading{overflow-y:auto;min-height:0}.reading p{margin:8px 0}rt{font-size:.65em}#resultActions{display:grid;gap:6px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(min-width:800px){main{padding:12px}#world{height:clamp(160px,calc(var(--app-height) - 400px),420px)}}
</style></head><body><main><header><a class="action" id="labLink" href="../" aria-label="ラボ一覧へ戻る">← ラボ</a><button id="home" aria-label="タイトル画面にもどる" hidden>⌂</button><h1><ruby>喜名番所<rt>きなばんしょ</rt></ruby> 3D</h1><button id="explain" aria-label="説明を開く">📖</button><button id="sound" aria-pressed="true" aria-label="音の切り替え">🔊</button></header>
<section id="intro"><h2>おしごと大作戦！</h2><p>小さな<ruby>沖縄<rt>おきなわ</rt></ruby>の村で、<ruby>旅人<rt>たびびと</rt></ruby>をむかえよう。</p><button id="story">📖 ものがたり</button><label>遊び方<select id="mode"><option value="challenge">おしごと大作戦</option><option value="relax">のんびり（時間制限なし）</option></select></label><button id="start" class="primary">はじめる</button></section>
