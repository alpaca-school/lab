 // Alpaca: long ears, fluffy forelock, muzzle and flight suit.

 ctx.beginPath();ctx.arc(0,-5,3,0,Math.PI);ctx.strokeStyle='#80574c';ctx.lineWidth=1.2;ctx.stroke();
 oval(-8,2,3.5,4,'#f5e2c6');oval(8,2,3.5,4,'#f5e2c6');

 ctx.beginPath();ctx.arc(0,-10,24,0,Math.PI*2);ctx.fillStyle='rgba(135,218,251,.13)';ctx.fill();ctx.strokeStyle='#b8f4ff';ctx.lineWidth=1.6;ctx.stroke();

 oval(-25,7,3,3,'#76f6dc');oval(25,7,3,3,'#76f6dc');
 ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#153747';ctx.fillText('H-01',0,18);
 ctx.font='bold 12px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#132337';ctx.strokeText('ハーリー',0,34);ctx.fillStyle='#fff';ctx.fillText('ハーリー',0,34);ctx.restore();
 if(state.phase===3){ctx.fillStyle='#112738ee';ctx.fillRect(0,height*.28,width,height*.4);ctx.textAlign='center';ctx.font='bold 24px system-ui';ctx.fillStyle='#c6ffd9';ctx.fillText('ミッションクリア！',width*.5,height*.47);ctx.font='14px system-ui';ctx.fillText('酸素を全部届けたよ！',width*.5,height*.57)}

 const p=state.phase;look=state.lane-1;
 $('mission').textContent=['酸素を集めよう','心臓を通過しよう','酸素を届けよう','🎉 配達完了！'][p];

 if(action==='left'||action==='right'){refresh();message(['左','中央','右'][state.lane]+'の列だよ。');return}

requestAnimationFrame(draw);
$('left').onclick=()=>act('left');$('right').onclick=()=>act('right');$('forward').onclick=()=>act('forward');
$('inspect').onclick=()=>{if(state.phase===0||state.phase===2){state={...state,lane:targetLane()};refresh();message('目標の列に移動したよ。進むボタンを押そう。')}};
canvas.addEventListener('click',e=>{if(state.phase===3)return;const b=canvas.getBoundingClientRect(),x=e.clientX-b.left;const lane=x<width*.36?0:x>width*.64?2:1;state={...state,lane};refresh()});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 動きを再開':'⏸ 動きを止める';$('pause').setAttribute('aria-pressed',String(paused))};
$('sound').onclick=()=>{sound=!sound;$('sound').querySelector('.audio-state').textContent=sound?'ON':'OFF';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'読み上げをオフにする':'読み上げをオンにする');if(sound)say('赤血球の酸素集め');else if('speechSynthesis'in window)speechSynthesis.cancel()};
function dialog(title,body){$('heading').textContent=title;$('details').innerHTML=body;$('info').showModal()}
$('help').onclick=()=>dialog('あそび方','<p>光る酸素や細胞と同じ列へ移動して、進むボタンを押そう。BGMボタンで冒険の音楽と効果音をオンにできるよ。画面の列をタップしても移動できるよ。</p><p>ハーリーの探査艇で赤血球の働きを体験しよう。肺で酸素を受け取る→心臓を通過する→全身の細胞へ届ける。目標の列へボタンで移動を手助けできるよ。</p>');
$('close').onclick=()=>$('info').close();
$('finish').onclick=()=>dialog('探検のまとめ','<p>'+(state.phase===3?'酸素の配達を全部達成したね！':'途中までの探検も立派な学びだよ。')+'</p><p>赤血球は肺の毛細血管で酸素を受け取り、心臓から送り出されて全身の組織に酸素を届けるよ。酸素はヘモグロビンに結びついて運ばれるよ。</p><p>📚 出典・参考文献<br><a href="https://www.nhlbi.nih.gov/health/heart/blood-flow" target="_blank" rel="noopener noreferrer">米国国立心肺血液研究所：How Blood Flows through the Heart</a></p><p><a href="https://lab.alpaca-school.okinawa/">🔬 ラボ一覧にもどる</a></p>');
$('reset').onclick=()=>{state=transition(state,'reset');position=0;clock=0;paused=false;finished=false;$('pause').textContent='⏸ 動きを止める';$('pause').setAttribute('aria-pressed','false');refresh();if(bgm){beat=0;startMusic()}message('ハーリー「もう一回、出発だ！」')};
refresh();
</script></body></html>
