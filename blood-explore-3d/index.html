<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>血液のたび 3D｜はじめての血管探検</title><style>
*{box-sizing:border-box}body{margin:0;background:#111d2c;color:#f8f5f4;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}a{color:#bceee1}button{font:inherit;color:white;background:#30475c;border:1px solid #61778b;border-radius:12px;padding:10px;min-height:44px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ffe495}button.primary{background:#176d60;border-color:#65bfa9;font-weight:bold}h1{font-size:clamp(19px,5vw,26px);margin:0}p{margin:0;line-height:1.6}.scene{position:relative;overflow:hidden;border:1px solid #b15a68;border-radius:16px;height:clamp(210px,43dvh,420px);background:#491b2d}canvas{width:100%;height:100%;display:block;touch-action:pan-y;position:relative} .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .scene.ready .fallback{display:none}.hud{position:absolute;top:10px;left:10px;background:#101d2ce0;border-radius:8px;padding:6px 10px;font-size:13px;pointer-events:none}.panel{background:#1b2d40;border:1px solid #40536b;border-radius:12px;padding:12px;min-height:66px}.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}small{color:#c1cbd7}dialog{max-width:min(90vw,480px);background:#182b3c;color:white;border:1px solid #69869a;border-radius:16px;padding:20px}dialog::backdrop{background:#0009}dialog p{margin:10px 0}ruby rt{font-size:.55em}[hidden]{display:none!important}</style></head><body><main><header><a href="https://lab.alpaca-school.okinawa/">← 🔬 ラボ一覧</a><button id="sound" aria-pressed="false">音声 OFF</button></header><h1>血液のたび 3D</h1><small>第1弾｜はじめての血管探検</small><div class="scene"><svg class="fallback" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="t"><stop stop-color="#210d1d"/><stop offset=".5" stop-color="#742737"/><stop offset="1" stop-color="#e19095"/></radialGradient><radialGradient id="r"><stop stop-color="#8b1d36"/><stop offset=".45" stop-color="#b82c42"/><stop offset=".75" stop-color="#ff7777"/><stop offset="1" stop-color="#8b1d36"/></radialGradient></defs><rect width="400" height="260" fill="url(#t)"/><ellipse cx="200" cy="130" rx="24.0" ry="20" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="200" cy="130" rx="42.0" ry="35" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="200" cy="130" rx="66.0" ry="55" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="200" cy="130" rx="96.0" ry="80" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="200" cy="130" rx="144.0" ry="120" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="200" cy="130" rx="216.0" ry="180" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="200" cy="130" rx="288.0" ry="240" fill="none" stroke="#ffb0b1" stroke-opacity=".2" stroke-width="4"/><ellipse cx="65" cy="60" rx="26" ry="14.3" transform="rotate(35 65 60)" fill="url(#r)" stroke="#f79898"/><ellipse cx="120" cy="200" rx="35" ry="19.25" transform="rotate(-20 120 200)" fill="url(#r)" stroke="#f79898"/><ellipse cx="310" cy="60" rx="22" ry="12.100000000000001" transform="rotate(-32 310 60)" fill="url(#r)" stroke="#f79898"/><ellipse cx="290" cy="205" rx="28" ry="15.400000000000002" transform="rotate(25 290 205)" fill="url(#r)" stroke="#f79898"/><ellipse cx="200" cy="100" rx="12" ry="6.6000000000000005" transform="rotate(20 200 100)" fill="url(#r)" stroke="#f79898"/><ellipse cx="170" cy="145" rx="10" ry="5.5" transform="rotate(-15 170 145)" fill="url(#r)" stroke="#f79898"/><ellipse cx="235" cy="155" rx="15" ry="8.25" transform="rotate(40 235 155)" fill="url(#r)" stroke="#f79898"/><ellipse cx="345" cy="145" rx="18" ry="9.9" transform="rotate(50 345 145)" fill="url(#r)" stroke="#f79898"/></svg><canvas id="view" aria-label="血管内の立体的な模式図。赤血球が流れる様子を観察できます"></canvas><div class="hud" id="hud">探検スタート地点</div></div><div class="panel" id="message" aria-live="polite">アルパカ号で血管の中へ！ 赤い円盤のようなものを探してみよう。</div><div class="controls"><button id="left" aria-label="左を観察">◀ 左</button><button id="forward" class="primary">▲ 進む</button><button id="right" aria-label="右を観察">右 ▶</button></div><div class="actions"><button id="inspect">🔍 赤血球を観察</button><button id="pause" aria-pressed="false">⏸ 観察を止める</button></div><div class="actions"><button id="help">あそび方</button><button id="reset">もういちど</button><button id="finish">探検を終える</button></div><noscript><p>この画面ではゲームの動作に必要なJavaScriptが無効です。HTMLをブラウザで開いて遊んでください。</p></noscript><small>※ 血管内を拡大した学習用の模式表現です。大きさ・速さは実際とは異なります。</small><dialog id="info"><h2 id="heading"></h2><div id="details"></div><button id="close" class="primary">もどる</button></dialog></main><script>
'use strict';const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');let width=1,height=1,dpr=1,look=0,position=0,clock=0,last=0,paused=false,sound=false,found=false,finished=false,targets=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const cells=Array.from({length:38},(_,i)=>{const a=i*2.399963,r=.15+.64*((i*37%97)/97);return {x:Math.cos(a)*r,y:Math.sin(a)*r,z:3+(i*17%43)*.65,a:i*.71}});function resize(){const r=canvas.getBoundingClientRect();width=Math.max(1,r.width);height=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}if(typeof ResizeObserver!=="undefined"){new ResizeObserver(resize).observe(canvas)}else{window.addEventListener("resize",resize)}resize();function say(t){if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';speechSynthesis.speak(u)}}function message(t){$('message').textContent=t;say(t)}function project(x,y,z){const f=Math.min(width,height)*1.35;return [width*.5+(x-look*.25)*f/z,height*.5+y*f/z,f/z]};function draw(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!paused&&!finished&&!reduced)clock+=dt;const cx=width*.5-look*width*.09,cy=height*.5;let g=ctx.createRadialGradient(cx,cy,4,cx,cy,Math.max(width,height)*.65);g.addColorStop(0,'#200d1d');g.addColorStop(.45,'#742737');g.addColorStop(1,'#e19095');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);for(let i=18;i>=0;i--){const z=1.1+i*.72+((clock*.4+position*.3)% .72);const rr=Math.min(width,height)*1.55/z;ctx.beginPath();ctx.ellipse(cx,cy,rr*1.15,rr,0,0,Math.PI*2);ctx.strokeStyle='rgba(255,176,177,'+(.04+.12/(1+i*.2))+')';ctx.lineWidth=Math.max(1,rr*.045);ctx.stroke()}const list=cells.map(c=>({...c,depth:1.4+((c.z-1.4-clock*.7-position*.6)%26+26)%26})).sort((a,b)=>b.depth-a.depth);targets=[];for(const c of list){const [x,y,s]=project(c.x,c.y,c.depth),r=s*.26,ry=r*(.45+.35*Math.abs(Math.sin(c.a+clock*.4)));if(r<1)continue;ctx.save();ctx.translate(x,y);ctx.rotate(c.a+clock*.2);const grad=ctx.createRadialGradient(-r*.22,-ry*.25,0,0,0,r);grad.addColorStop(0,'#9f263c');grad.addColorStop(.48,'#b82c42');grad.addColorStop(.75,'#ff7777');grad.addColorStop(1,'#8b1d36');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(0,0,r,ry,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fa9695';ctx.lineWidth=Math.max(.6,r*.025);ctx.stroke();ctx.restore();targets.push({x,y,r:Math.max(r,16)})}canvas.parentElement.classList.add("ready");requestAnimationFrame(draw)}requestAnimationFrame(draw);function observe(){found=true;message('発見！ 赤血球（せっけっきゅう）は、肺で受け取った酸素を全身へ運ぶよ。');$('hud').textContent='赤血球を発見！'}canvas.addEventListener('click',e=>{const b=canvas.getBoundingClientRect();if(targets.some(t=>Math.hypot(e.clientX-b.left-t.x,e.clientY-b.top-t.y)<t.r))observe();else message('赤い円盤を探そう。下の観察ボタンでも発見できるよ。')});$('inspect').onclick=observe;$('left').onclick=()=>{look=Math.max(-2,look-1);message('左の血管壁と血液の流れを観察しよう。')};$('right').onclick=()=>{look=Math.min(2,look+1);message('右の血管壁と血液の流れを観察しよう。')};$('forward').onclick=()=>{position++;$('hud').textContent='探検 '+position+' 歩';message(position===1?'血管の奥へ進んだよ。赤血球が流れているね。':'血液が通る道が続いているね。')};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 観察を再開':'⏸ 観察を止める';$('pause').setAttribute('aria-pressed',String(paused))};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音声 '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound));if(sound)say('血液のたび');else if('speechSynthesis'in window)speechSynthesis.cancel()};function dialog(title,body){$('heading').textContent=title;$('details').innerHTML=body;$('info').showModal()}$('help').onclick=()=>dialog('あそび方','<p>進む・左右ボタンで血管の中を探検しよう。赤血球をタップするか、観察ボタンを押してみよう。停止ボタンで動きを止めて観察できるよ。</p><p>いつでも探検を終えられるよ。</p>');$('close').onclick=()=>$('info').close();$('finish').onclick=()=>{finished=true;dialog('探検のまとめ','<p>'+(found?'赤血球を発見できたね！':'次は赤血球も見つけてみよう。')+'</p><p>心臓は血液を送り出し、血管は血液の通り道になる。赤血球は肺から全身に酸素を運ぶよ。</p><p>📚 出典・参考文献<br><a href="https://www.nhlbi.nih.gov/health/blood-tests" target="_blank" rel="noopener noreferrer">米国国立心肺血液研究所：Blood Tests</a><br><a href="https://www.nhlbi.nih.gov/health/heart/blood-flow" target="_blank" rel="noopener noreferrer">同：How Blood Flows through the Heart</a></p><p><a href="https://lab.alpaca-school.okinawa/">🔬 ラボ一覧にもどる</a></p>');};$('info').addEventListener('close',()=>{finished=false});$('reset').onclick=()=>{position=0;look=0;clock=0;found=false;paused=false;finished=false;$('pause').textContent='⏸ 観察を止める';$('pause').setAttribute('aria-pressed','false');$('hud').textContent='探検スタート地点';message('もういちど血管を探検しよう！')};</script></body></html>
