const state={filter:"all",query:""};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function feedback(g){return g.idea||("https://ittoushouguu.ryukyu-tane.com/?campaign=alpaca-lab-feedback-2026&game="+encodeURIComponent(g.title));}
function visibleGames(){return games.filter(g=>g.visible!==false&&g.status!=="hidden").filter(g=>{
 const q=state.query.toLowerCase();
 const hay=[g.title,g.meta,g.desc,...g.tagTexts].join(" ").toLowerCase();
 const filter=state.filter==="all"||g.status===state.filter||g.tags.includes(state.filter);
 return filter&&(!q||hay.includes(q));
});}
function openModal(id){
 const g=games.find(x=>x.id===id);if(!g)return;
 $("#modalTitle").textContent=g.title;
 $("#modalMeta").textContent=g.meta;
 $("#modalDesc").textContent=g.desc;
 $("#modalStatus").textContent=g.status==="published"?"公開中":"開発中";
 $("#modalStatus").className="modal-status "+(g.status==="published"?"published":"dev");
 $("#modalTags").innerHTML=g.tagTexts.map(t=>"<span>"+esc(t)+"</span>").join("");
 $("#modalPlay").href=g.href;$("#modalPreview").src=g.href;
 $("#modalIdea").href=feedback(g);
 $("#modal").classList.add("show");$("#modal").setAttribute("aria-hidden","false");$("#modalClose").focus();
}
function closeModal(){const m=$("#modal");m.classList.remove("show");m.setAttribute("aria-hidden","true");$("#modalPreview").src="about:blank";}
function bindCommon(){
 $("#search").addEventListener("input",e=>{state.query=e.target.value.trim();render();});
 $$(".filter").forEach(b=>b.addEventListener("click",()=>{state.filter=b.dataset.filter;$$(".filter").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render();}));
 $("#modalClose").addEventListener("click",closeModal);
 $("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
 document.addEventListener("click",e=>{const c=e.target.closest("[data-open]");if(c){e.preventDefault();openModal(c.dataset.open);}});
}
function parseGviz(text){
 const m=text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);\s*$/);if(!m)return[];
 const r=JSON.parse(m[1]);if(!r||r.status!=="ok")return[];
 const cols=r.table.cols.map(c=>(c.label||c.id||"").trim());
 return r.table.rows.map(row=>cols.reduce((o,n,i)=>{o[n]=row.c&&row.c[i]?row.c[i].v:null;return o;},{})).filter(x=>x.game_id);
}
async function loadRemote(){
 try{
  const u="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?gid="+SHEET_GID+"&tqx=out:json";
  const t=await (await fetch(u,{credentials:"omit"})).text(),rows=parseGviz(t),map=new Map(rows.map(r=>[String(r.game_id).trim(),r]));
  games.forEach(g=>{const r=map.get(g.id);if(!r)return;const raw=String(r.status||"").trim();g.status=raw==="公開中"?"published":raw==="開発中"?"dev":raw==="非表示"?"hidden":g.status;g.visible=r.visible===true||String(r.visible).toUpperCase()==="TRUE";g.order=Number(r.sort_order)||9999;});
  games.sort((a,b)=>(a.order||9999)-(b.order||9999));render();
 }catch(e){}
}

function card(g){return `<button type="button" class="mini ${g.status==="published"?"published":"dev"}" data-open="${esc(g.id)}"><span class="frame"><span class="ico">${esc(g.thumb)}</span><span class="t">${esc(g.title)}</span><span class="m">${esc(g.meta)}</span><span class="st">${g.status==="published"?"公開中":"開発中"}</span></span></button>`;}
function render(){const list=visibleGames(),pub=list.filter(g=>g.status==="published"),dev=list.filter(g=>g.status==="dev");$("#pubGrid").innerHTML=pub.map(card).join("");$("#devGrid").innerHTML=dev.map(card).join("");$("#pubCount").textContent=pub.length+"作品";$("#devCount").textContent=dev.length+"作品";$("#pubSec").hidden=pub.length===0;$("#devSec").hidden=dev.length===0;$("#empty").hidden=list.length>0;}
bindCommon();render();loadRemote();
</script></body></html>
