<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2a0f1c"><meta name="description" content="食べものといっしょに、からだの中を3Dで旅して、うんちとおしっこが出るまでを学ぼう。"><title>しょうかの たび 3D｜アルパカすく〜るラボ</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2a0f1c;font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#fff;touch-action:manipulation}
#root,.app{position:fixed;inset:0}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block}

.chips{display:flex;gap:4px;flex:1}

.chip.ok{background:#7be37b;color:#124d12;opacity:1}
.vbtn{width:44px;height:44px;border-radius:50%;background:#ffffff33;font-size:22px;color:#fff}
.map{position:absolute;right:8px;top:72px;z-index:5;width:104px;background:#000a;border-radius:16px;padding:6px 6px 8px;text-align:center}.map svg{width:100%;height:min(300px,calc(100dvh - 470px));min-height:150px;display:block}.mapt{font-size:12px;font-weight:bold;color:#ffd966}.mapn{font-size:14px;font-weight:900;background:#ffd966;color:#5a2a00;border-radius:10px;padding:2px 4px;margin-top:4px}.mk{animation:mk 1s ease-in-out infinite}@keyframes mk{50%{transform:scale(1.35);opacity:.4}}
.meters{position:absolute;top:74px;left:10px;z-index:5;display:flex;flex-direction:column;gap:6px}

.panel{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:7;background:#fff;color:#4a2030;border-radius:24px;padding:14px 16px;box-shadow:0 6px 24px #0008}
.ptitle{font-size:26px;font-weight:900;display:flex;align-items:center;gap:8px;color:#d6355a}
.no{background:#d6355a;color:#fff;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px}
.say{font-size:18px;line-height:1.55;margin:8px 0 4px;font-weight:600}
.rds{display:flex;gap:8px}.rd{background:#eef;color:#336;border-radius:14px;padding:6px 12px;font-size:14px;font-weight:bold}
.task{font-size:20px;font-weight:900;color:#e07a00;margin:8px 0}
.big{width:100%;background:linear-gradient(#ff7a9c,#e0345f);color:#fff;font-size:30px;font-weight:900;border-radius:22px;padding:14px 10px;box-shadow:0 6px 0 #a21e41;display:block}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a21e41}
.big:disabled{opacity:.6}
.big.go{margin-top:20px;max-width:340px;background:linear-gradient(#ffd966,#ff9f1c);box-shadow:0 6px 0 #b86a00;color:#5a2a00}
.big.brown{background:linear-gradient(#a8703f,#6d4120);box-shadow:0 6px 0 #3e2310}
.big.blue{background:linear-gradient(#59c8ff,#1f8fd6);box-shadow:0 6px 0 #0e5c8f}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots.lg{margin-top:2px}
.dots i{width:16px;height:16px;border-radius:50%;background:#ffffff66;border:2px solid #fff}
.dots.lg i{background:#eee;border-color:#ccc}
.dots i.f{background:#ffe45c;border-color:#ffb800}
.bub{position:absolute;width:76px;height:76px;border-radius:50%;font-size:40px;z-index:6;animation:fl 2.2s ease-in-out infinite;display:flex;align-items:center;justify-content:center;color:#fff}
.bub.star{background:radial-gradient(#fff6a8,#ffd400);box-shadow:0 0 24px #ffe45c}
.bub.water{background:radial-gradient(#d6f1ff,#3bb2ff);box-shadow:0 0 24px #59c8ff}
@keyframes fl{50%{transform:translateY(-14px) scale(1.06)}}
.banner{position:absolute;top:30%;left:6%;right:6%;z-index:9;text-align:center;font-size:32px;font-weight:900;background:#ffd966;color:#5a2a00;border-radius:24px;padding:18px;animation:pop .5s;box-shadow:0 8px 30px #0008}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.poop{position:absolute;top:45%;left:0;right:0;text-align:center;font-size:120px;z-index:8;animation:drop 1.4s ease-in}
@keyframes drop{from{transform:translateY(-120px) scale(.2);opacity:0}60%{transform:translateY(0) scale(1.2)}}
.over{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:max(24px,env(safe-area-inset-top)) 18px 20px;overflow:auto}
.title{justify-content:center;background:radial-gradient(#2a0f1ccc,#2a0f1cf2)}
.tt{font-size:46px;font-weight:900;color:#ffd966;text-shadow:0 4px 0 #a2451f;text-align:center}
.sub{font-size:20px;margin:6px 0 22px;text-align:center}
.pickl{font-size:20px;font-weight:bold;margin-bottom:10px}
.picks{display:flex;gap:12px}
.pick{width:98px;padding:12px 0;border-radius:22px;background:#ffffff22;color:#fff;border:4px solid transparent}
.pick span{font-size:46px;display:block}.pick small{font-size:16px;font-weight:bold}
.pick.on{background:#ffffff44;border-color:#ffd966;transform:scale(1.08)}
.pee,.quiz,.end{background:linear-gradient(#27145a,#4a1f4a)}
.back{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;color:#fff;background:#ffffff26;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:bold;text-decoration:none}.note{font-size:12px;line-height:1.6;opacity:.75;max-width:340px;text-align:center;margin-top:16px}
.ptitle2{font-size:28px;font-weight:900;color:#ffd966;margin-bottom:6px}
.say.w,.task.w{color:#fff;text-align:center;margin:4px 0}
.task.w{color:#ffd966}
.svg2{width:auto;height:min(52vh,450px);max-width:100%;flex-shrink:1}.steps{display:flex;gap:6px;margin:2px 0 6px}.st{width:76px;text-align:center;background:#ffffff1f;border-radius:12px;padding:3px 0;opacity:.6}.st b{font-size:18px;display:block}.st small{font-size:11px}.st.on{background:#ffd966;color:#5a2a00;opacity:1}.st.ok{background:#7be37b;color:#124d12;opacity:1}.big2{font-size:19px;min-height:60px}
.kp ellipse{animation:kp .3s}
@keyframes kp{50%{transform:scale(1.15);transform-box:fill-box;transform-origin:center}}
.fd{animation:fdr 1s linear infinite}

.qn{font-size:18px;margin-bottom:12px}
.qcard{background:#fff;color:#4a2030;border-radius:24px;font-size:28px;font-weight:900;padding:30px 18px;text-align:center;width:100%;max-width:360px;margin-bottom:24px}
.qa{display:flex;flex-direction:column;gap:16px;width:100%;max-width:360px}
.fbk{margin-top:18px;background:#ffefc2;color:#7a3a00;border-radius:18px;padding:14px;font-size:19px;font-weight:bold;max-width:360px;text-align:center}
.fbk.good{background:#c8ffd0;color:#0d5a1c;font-size:24px}
.end{justify-content:center}
.stamps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 16px}
.stamp{width:56px;height:56px;border-radius:50%;background:#ffd966;font-size:30px;display:flex;align-items:center;justify-content:center;animation:pop .6s backwards}
.stamp:nth-child(2){animation-delay:.1s}.stamp:nth-child(3){animation-delay:.2s}.stamp:nth-child(4){animation-delay:.3s}.stamp:nth-child(5){animation-delay:.4s}.stamp:nth-child(6){animation-delay:.5s}.stamp:nth-child(7){animation-delay:.6s}
.route{background:#ffffff22;border-radius:20px;padding:14px;max-width:360px;font-size:17px;line-height:1.6}
.route p{margin:2px 0 10px}

@media (max-height:760px){
.panel{padding:10px 12px;border-radius:20px;left:8px;right:8px}
.ptitle{font-size:21px}.no{width:28px;height:28px;font-size:16px}
.say{display:none;font-size:15px;margin:6px 0 2px;line-height:1.5}
.panel.open .say{display:block}
.rd{padding:4px 10px;font-size:13px}
.task{font-size:16px;margin:6px 0}
.big{font-size:24px;padding:10px 8px;border-radius:18px}
.dots{margin-top:4px}
.chip{font-size:15px}.chip small{font-size:8px}

.meters{top:64px}.meter{font-size:14px;padding:4px 10px}
.bub{width:62px;height:62px;font-size:32px}
.banner{font-size:24px;padding:12px;top:24%}.poop{font-size:84px;top:36%}
.tt{font-size:38px}.sub{margin-bottom:12px}.pick{width:88px;padding:8px 0}.pick span{font-size:38px}
.svg2{height:min(42vh,450px)}

}

  }
  .quiz .fbk.good{font-size:20px}

  .end{
    justify-content:flex-start;

    padding-bottom:max(18px,env(safe-area-inset-bottom));
  }
  .end .tt{
    font-size:34px;
    line-height:1.1;
    margin-top:0;
  }
  .end .sub{font-size:17px;margin:4px 0 10px}

  }

    margin-top:12px;
    padding:10px 8px;

  }

@media (max-width:430px) and (max-height:700px){
  .title{padding-top:max(58px,calc(env(safe-area-inset-top) + 44px))}
  .title .tt{font-size:34px;margin-bottom:6px}

  .title .pick{padding:6px 0}
  .title .pick span{font-size:32px}

  .quiz .qcard{font-size:21px;padding:16px 12px;margin-bottom:10px}
  .quiz .qa{gap:8px}
  .quiz .big{font-size:20px;padding:8px}
  .quiz .fbk{font-size:15px;margin-top:8px;padding:8px 10px}

.end-actions{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;align-items:stretch}

.end-back:active{transform:translateY(2px)}
@media(max-width:430px){
  .end-actions{gap:8px}
  .end-actions .big.go{margin-top:8px}
  .end-back{font-size:14px;padding:9px 12px}
}
@media(max-width:430px) and (max-height:700px){
  .end-actions{gap:6px}
  .end-actions .big.go{margin-top:6px;font-size:22px;padding:8px}
  .end-back{font-size:13px;padding:8px 10px}
}

.game-back{
  position:fixed;
  left:8px;
  z-index:999;

}

  .title .sub{margin:10px 0 18px}

  .title .note{margin-top:18px}
}
