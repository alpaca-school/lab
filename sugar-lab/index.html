<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e60012"><title>おさとうラボ！｜アルパカすく〜る</title><style>
:root{--red:#e60012;--yellow:#ffe35c;--blue:#1a76c8;--deep:#0d4f9c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#082e52;font-family:system-ui,"Hiragino Maru Gothic ProN",sans-serif}#app{max-width:430px;height:100vh;height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden;user-select:none}.hud{position:relative;z-index:2;background:var(--red);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 12px}.hud:after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 12px 0,var(--red) 11px,transparent 12px) repeat-x;background-size:24px 12px;pointer-events:none}.brand{display:flex;align-items:baseline;gap:5px;height:17px;margin:0 0 2px;font-size:10px;font-weight:1000;line-height:1;color:#fff;letter-spacing:.03em;white-space:nowrap;overflow:hidden}.brand b{color:var(--yellow);font-size:14px;text-shadow:0 2px #a8000f}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.time{background:white;color:var(--deep);padding:6px 12px;border-radius:20px;font-weight:900;font-size:18px}.evo{background:#fffdf4;color:#123c55;border:3px solid var(--yellow);border-radius:17px;padding:8px;box-shadow:0 3px #a8000f}.steps{display:flex;justify-content:space-between}.step{width:20%;text-align:center;opacity:.38;filter:grayscale(1)}.step.on{opacity:1;filter:none}.step .emoji{font-size:27px}.step small{display:block;font-size:9px;font-weight:900}.track{background:#dfe8df;border-radius:20px;height:9px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#52c5ee,#f4d26e,#d38b29,#84391d);transition:width .15s}.stage{flex:1;min-height:0;background:linear-gradient(#fff,#fffdf7 70%,#f7e8d1);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px 8px}.message{background:#fff;color:var(--deep);border-radius:16px;box-shadow:0 3px 10px #0d4f9c22;padding:10px;text-align:center;font-size:13px;font-weight:900;width:100%;margin-bottom:8px}.pot{width:min(100%,340px);flex:1;min-height:0;max-height:360px}.stats{display:flex;gap:7px;width:100%;margin-top:4px}.stat{flex:1;text-align:center;background:white;border:2px solid #cce6f4;border-radius:12px;color:var(--deep);padding:7px 2px}.stat small{display:block;font-size:10px;font-weight:800}.stat strong{font-size:18px}.bar{background:linear-gradient(#53b7e4,#0d70b5);display:flex;align-items:center;gap:8px;padding:12px 10px calc(12px + env(safe-area-inset-bottom))}button{font:inherit;cursor:pointer}.heat{flex:1;min-height:72px;border:3px solid var(--yellow);border-radius:36px;background:#fff;color:var(--red);font-size:17px;font-weight:1000;box-shadow:0 5px var(--deep);touch-action:none;-webkit-user-select:none}.heat.active{background:var(--yellow);transform:translateY(3px);box-shadow:0 2px var(--deep)}.smallbtn{min-height:58px;border:2px solid var(--yellow);border-radius:18px;background:#fff;color:var(--deep);font-weight:900;padding:0 10px}.foot{font-size:10px;color:#657686;text-align:center;padding:4px;background:#fff}@media(max-height:650px){.hud{padding-top:5px;padding-bottom:5px}.step .emoji{font-size:20px}.evo{padding:4px}.stage{padding-top:14px}.heat{min-height:55px}.bar{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}}
</style></head><body><main id="app"><header class="hud"><div class="brand">アルパカすく〜る <b>🍮 おさとうラボ！</b></div><div class="top"><strong>🔥 火加減を調節しよう！</strong><span class="time" id="clock">⏱ 00:00</span></div><div class="evo"><div class="steps"><div class="step on"><div class="emoji">💧</div><small>砂糖水</small></div><div class="step"><div class="emoji">🥄</div><small>溶ける</small></div><div class="step"><div class="emoji">🍯</div><small>シロップ</small></div><div class="step"><div class="emoji">🫧</div><small>煮詰める</small></div><div class="step"><div class="emoji">🍮</div><small>カラメル</small></div></div><div class="track"><div class="fill" id="fill"></div></div></div></header><section class="stage"><div class="message" id="msg" aria-live="polite">ボタンを長押しして、熱を送ろう！</div><svg class="pot" viewBox="0 0 320 320" aria-label="加熱で色が変わる鍋"><ellipse cx="160" cy="283" rx="110" ry="15" fill="#d4aa80" opacity=".35"/><path id="steam" d="M110 75q-15-20 0-40m50 35q-15-20 0-40m50 45q-15-20 0-40" stroke="#9dcbd6" stroke-width="7" stroke-linecap="round" fill="none" opacity="0"/><path d="M52 110H268L252 239Q250 260 225 260H95Q70 260 68 239Z" fill="#b9d4e0" stroke="#678899" stroke-width="7"/><path id="liquid" d="M64 160Q160 150 256 160L246 237Q245 250 224 250H96Q75 250 74 237Z" fill="#b8e8f5"/><g id="bubbles" fill="none" stroke="white" stroke-width="4" opacity="0"><circle cx="110" cy="195" r="9"/><circle cx="155" cy="222" r="6"/><circle cx="207" cy="183" r="11"/><circle cx="185" cy="236" r="5"/></g><path d="M42 112H278" stroke="#678899" stroke-width="9" stroke-linecap="round"/><path id="fire" d="M105 280Q113 259 125 280Q137 249 151 280Q167 247 181 280Q195 256 212 280" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round" opacity="0"/></svg><div class="stats"><div class="stat"><small>温度（モデル）</small><strong id="temp">25℃</strong></div><div class="stat"><small>水分（モデル）</small><strong id="water">100%</strong></div><div class="stat"><small>熱を送った時間</small><strong id="heatTime">0秒</strong></div></div></section><footer class="bar"><button class="heat" id="heat" type="button">🔥 長押しで熱を送る</button><button class="smallbtn" id="sound" type="button" aria-label="音の切り替え">🔊</button><button class="smallbtn" id="reset" type="button">↻ 最初から</button></footer><div class="foot">※学習用の簡易モデルです。実際の加熱実験は大人と一緒に。</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),steps=[...document.querySelectorAll('.step')];let temp=25,water=100,heatTime=0,elapsed=0,heating=false,done=false,soundOn=true,audio=null,osc=null,gain=null,last=performance.now(),prevStage=-1;const button=$('heat');
function ensureAudio(){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}
function beep(freq=550,duration=.15){if(!soundOn||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration+.01)}catch(e){}}
function hum(on){if(!audio||!soundOn)return;if(on&&!osc){osc=audio.createOscillator();gain=audio.createGain();osc.type='triangle';osc.frequency.value=105;gain.gain.value=.018;osc.connect(gain).connect(audio.destination);osc.start()}else if(!on&&osc){try{osc.stop()}catch(e){}osc.disconnect();osc=null;gain=null}}
function start(e){if(done||heating)return;e.preventDefault();ensureAudio();heating=true;button.classList.add('active');button.textContent='🔥 加熱中！ 離すと止まる';hum(true);beep(370,.08);try{button.setPointerCapture(e.pointerId)}catch(_){}}
function stop(){if(!heating)return;heating=false;button.classList.remove('active');button.textContent='🔥 長押しで熱を送る';hum(false)}
button.addEventListener('pointerdown',start);['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(n=>button.addEventListener(n,stop));window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});button.addEventListener('contextmenu',e=>e.preventDefault());
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';if(soundOn){ensureAudio();beep(650)}else hum(false)});$('reset').addEventListener('click',()=>{stop();temp=25;water=100;heatTime=0;elapsed=0;done=false;prevStage=-1;beep(500);render()});
function stage(){if(temp>=185&&water<=5)return 5;if(temp>=158&&water<28)return 4;if(water<40)return 3;if(water<75)return 2;if(temp>70)return 1;return 0}
function render(){const s=stage(),labels=['長押しして、砂糖水を温めよう！','砂糖が溶けてきた！','水分が減って、シロップになった！','とろみが増してきた！','カラメルになった！ 火を止めよう！','焦げすぎ！ もう一度挑戦しよう'];$('msg').textContent=labels[s];$('temp').textContent=Math.round(temp)+'℃';$('water').textContent=Math.round(water)+'%';$('heatTime').textContent=Math.floor(heatTime)+'秒';const seconds=Math.floor(elapsed);$('clock').textContent='⏱ '+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');$('fill').style.width=Math.min(100,Math.max(0,((100-water)*.65+Math.max(0,temp-25)*.25)))+'%';steps.forEach((x,i)=>x.classList.toggle('on',i<=Math.min(4,s)));$('liquid').setAttribute('fill',['#b8e8f5','#dce8bb','#f2ce83','#e2a74d','#a95a24','#482416'][s]);$('bubbles').setAttribute('opacity',temp>98?1:0);$('steam').setAttribute('opacity',temp>95?.8:0);$('fire').setAttribute('opacity',heating?1:0);if(s!==prevStage){if(s===4)beep(820,.35);if(s===5)beep(180,.5);prevStage=s}if(s===5){done=true;stop()}}
function frame(now){const dt=Math.min(.07,(now-last)/1000);last=now;if(heating&&!done){elapsed+=dt;heatTime+=dt;temp=Math.min(205,temp+24*dt)}else{temp=Math.max(25,temp-(temp>100?6:12)*dt)}if(temp>98&&water>0)water=Math.max(0,water-(temp>155?14:9)*dt);render();requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
})();</script></body></html>
