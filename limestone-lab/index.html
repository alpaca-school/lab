<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">\n<meta name="apple-mobile-web-app-title" content="にごりラボ！">
<meta name="description" content="アルパカすく〜る｜石灰水と二酸化炭素の変化から、沖縄の琉球石灰岩を学ぶ体験型Webゲーム">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>シーサー研究員の にごりラボ｜アルパカすく〜る</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --sky:#dff6ff;--sea:#2aa8cf;--deep:#07506d;--red:#d94d3f;--yellow:#ffd95a;
  --paper:#fffdf4;--green:#43a96b;--ink:#143b4b;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{margin:0;width:100%;min-height:100%;background:#dff6ff;color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;overscroll-behavior:none}
button,input{font:inherit}button{touch-action:manipulation}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.game-shell{
  width:min(100vw,480px);min-height:100dvh;margin:auto;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#9edff4 0%,#e9fbff 50%,#f8f2d8 100%);
  padding-bottom:calc(12px + var(--safe));
}
.top{
  min-height:124px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 9px;
  background:linear-gradient(180deg,#0b6e8f,#0a5d7d);color:#fff;position:relative;z-index:20;
  box-shadow:0 5px 0 rgba(4,61,84,.2)
}
.brand{font-size:11px;font-weight:900;letter-spacing:.08em;opacity:.9}
.hud{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:3px}
.scorebox .lbl,.nextbox .lbl{font-size:10px;font-weight:900;letter-spacing:.06em}
.score{font-size:34px;line-height:1;font-weight:1000;color:var(--yellow);font-variant-numeric:tabular-nums}
.nextbox{display:flex;align-items:center;gap:7px}
.nextbubble{min-width:76px;height:48px;border-radius:24px;background:#fff;color:var(--deep);display:grid;place-items:center;padding:0 10px;font-weight:1000;box-shadow:0 3px #043e57}
.nexttext{font-size:11px;font-weight:900;line-height:1.25}
.progress-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.progress-chip{background:#ffffff22;border:1px solid #ffffff66;border-radius:12px;padding:5px 6px;text-align:center;font-size:10px;font-weight:900}
.progress-chip.on{background:#fff;color:var(--deep)}
.screen{display:none;min-height:calc(100dvh - 124px)}
.screen.active{display:block}
.title-screen{padding:24px 18px 18px;text-align:center}
.title-badge{display:inline-block;background:#fff;color:var(--deep);font-weight:1000;border-radius:99px;padding:7px 13px;box-shadow:0 3px #55a9c5}
.title-screen h1{font-size:clamp(31px,9vw,44px);line-height:1.03;margin:12px 0 7px;color:#0a5b7b;text-shadow:0 3px #fff}
.title-screen h1 em{font-style:normal;color:var(--red)}
.title-screen .lead{font-size:14px;line-height:1.55;font-weight:800;color:#285e70;margin:6px auto;max-width:360px}
.shisa-big{font-size:92px;line-height:1;margin:12px 0 4px;filter:drop-shadow(0 7px 5px rgba(48,82,96,.18));animation:bob 2s ease-in-out infinite}
.start-btn,.big-btn{
  width:100%;max-width:330px;border:0;border-radius:28px;padding:15px 18px;font-size:20px;font-weight:1000;
  background:var(--yellow);color:#7a4317;box-shadow:0 6px #c7952b,0 0 0 3px #fff inset
}
.start-btn:active,.big-btn:active{transform:translateY(4px);box-shadow:0 2px #c7952b,0 0 0 3px #fff inset}
.safety-note{font-size:10px;color:#466875;line-height:1.45;margin:11px auto 0;max-width:350px}
.play-screen{padding:10px 10px 112px;height:calc(100dvh - 124px);min-height:0;overflow:hidden}
.mission{
  background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px rgba(26,93,115,.16);
  display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center
}
.shisa-face{font-size:45px;line-height:1;transform-origin:center}
.shisa-face.happy{animation:happy .5s ease-in-out 2}
.mission h2{font-size:16px;line-height:1.25;margin:0 0 3px;color:#0a5d7d}
.mission p{font-size:11px;line-height:1.45;margin:0;color:#456c78;font-weight:700}
.lab{
  position:relative;height:calc(100dvh - 430px);min-height:170px;max-height:340px;margin:6px 0;
  border-radius:24px;background:linear-gradient(#b9edf8 0 58%,#d9c89c 58% 100%);overflow:hidden;
  box-shadow:inset 0 0 0 3px #ffffff99
}
.cloud{position:absolute;top:17px;left:-20px;width:90px;height:23px;border-radius:99px;background:#fff9;animation:float 8s ease-in-out infinite alternate}
.cloud:before{content:"";position:absolute;width:38px;height:35px;border-radius:50%;left:22px;top:-17px;background:#fff}
.coral-bg{position:absolute;right:8px;bottom:70px;font-size:44px;opacity:.3;filter:saturate(.7)}
.co2-tank{
  position:absolute;left:14px;bottom:24px;width:70px;height:118px;border-radius:22px 22px 17px 17px;
  background:linear-gradient(90deg,#dce5e7,#fff,#c6d3d7);border:4px solid #627780;box-shadow:0 8px 10px #46636b33;
  transition:transform .12s ease
}
.co2-tank.pumping{animation:tankShake .18s ease-in-out infinite alternate}
.co2-tank:before{content:"CO₂";position:absolute;left:11px;right:11px;top:39px;background:#fff;border-radius:8px;text-align:center;font-size:17px;font-weight:1000;color:#5b6d74}
.co2-valve-btn{
  position:absolute;z-index:8;left:50%;top:-34px;transform:translateX(-50%);
  width:76px;height:62px;border:0;background:transparent;padding:0;touch-action:none;
  display:grid;place-items:start center;cursor:pointer
}
.co2-valve-btn .valve{
  display:block;margin-top:14px;width:38px;height:20px;border-radius:8px;
  background:#d94d3f;border:3px solid #81352d;box-shadow:0 4px #6f2d27;
  transform-origin:center;transition:transform .08s,box-shadow .08s,background .08s
}
.co2-valve-btn.active .valve{
  transform:translateY(4px) scaleY(.82);box-shadow:0 1px #6f2d27;background:#f05b4e
}
.co2-valve-btn:focus-visible{outline:3px solid #ffd95a;outline-offset:3px;border-radius:16px}
.valve-hint{
  position:absolute;z-index:7;left:84px;bottom:128px;background:#fff9c9;color:#744d13;
  border:2px solid #ffd95a;border-radius:14px;padding:6px 9px;font-size:10px;font-weight:1000;
  box-shadow:0 3px rgba(90,63,10,.16);animation:hintBob 1.1s ease-in-out infinite
}
.valve-hint:before{
  content:"";position:absolute;left:-9px;bottom:8px;border-width:7px 9px 7px 0;border-style:solid;
  border-color:transparent #ffd95a transparent transparent
}
.flow-label{
  position:absolute;z-index:7;left:88px;bottom:126px;background:#e5fbff;color:#075b78;
  border:2px solid #71c7df;border-radius:14px;padding:6px 9px;font-size:10px;font-weight:1000
}
@keyframes tankShake{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
@keyframes hintBob{50%{transform:translateY(-3px)}}
.hose{position:absolute;left:74px;bottom:88px;width:92px;height:75px;border-left:6px solid #4d6269;border-bottom:6px solid #4d6269;border-radius:0 0 0 21px;transform:rotate(-8deg)}
.beaker{
  position:absolute;left:50%;transform:translateX(-39%);bottom:19px;width:185px;height:214px;
  border:5px solid rgba(121,153,162,.72);border-top:0;border-radius:0 0 25px 25px;overflow:hidden;
  background:linear-gradient(90deg,#ffffff45,#ffffff15,#ffffff60);box-shadow:inset 0 0 0 2px #fff8
}
.beaker:before{content:"";position:absolute;left:-7px;right:-7px;top:0;border-top:5px solid #819aa2}
.liquid{position:absolute;left:4px;right:4px;bottom:4px;height:73%;border-radius:0 0 19px 19px;background:linear-gradient(180deg,#eafcff,#bcecf6);overflow:hidden}
.cloudiness{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .18s}
.particle{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 4px #fff;opacity:.8;animation:drift var(--t,2.3s) ease-in-out infinite alternate;left:var(--x,50%);top:var(--y,50%)}
.bubble{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:#ffffff45;bottom:-12px;left:var(--x,25%);animation:rise var(--t,1.5s) linear forwards}
.white-label{
  position:absolute;right:7px;top:7px;background:#ffffffdf;color:#245465;border-radius:12px;padding:5px 8px;
  font-size:10px;font-weight:1000
}
.cloud-meter{
  position:absolute;left:92px;right:10px;top:12px;background:#ffffffdf;border-radius:13px;padding:7px 8px;color:#245465
}
.cloud-meter .row{display:flex;justify-content:space-between;font-size:9px;font-weight:900}
.track{height:10px;border-radius:99px;background:#d9ebef;overflow:hidden;margin-top:4px;border:2px solid #fff}
.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#71c7df,#fff);transition:width .16s}
.status-panel{margin-top:7px}
.reaction{
  background:#fff;border-radius:14px;padding:7px 10px;min-height:40px;display:flex;align-items:center;gap:7px;
  box-shadow:0 3px rgba(26,93,115,.14);font-size:11px;font-weight:900;line-height:1.28;color:#285d6f
}
.reaction.good{background:#e4f8e8;color:#26633b}.reaction.warn{background:#fff3cf;color:#805a13}
.controls{
  position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,480px);
  padding:8px 10px calc(10px + var(--safe));background:linear-gradient(180deg,#0c6f92ee,#07516fee);
  border-top:3px solid #ffffff77;display:grid;grid-template-columns:1.25fr .75fr;gap:8px
}
.play-screen.complete-mode.active{
  display:flex;flex-direction:column;padding-bottom:92px
}
.complete-mode{padding-bottom:92px}
.complete-mode .mission{padding:6px 9px;min-height:0}
.complete-mode .mission .shisa-face{font-size:34px}
.complete-mode .mission h2{font-size:14px;margin-bottom:0}
.complete-mode .mission p{display:none}
.complete-mode .status-panel{margin-top:4px}
.complete-mode .reaction{min-height:34px;padding:5px 8px;font-size:10px}
.complete-mode .discovery{gap:4px;margin-top:4px}
.complete-mode .discovery-card{min-height:38px;padding:4px 6px;grid-template-columns:22px 1fr;gap:5px}
.complete-mode .discovery-card .mark{width:22px;height:22px;font-size:11px}
.complete-mode .discovery-card .eyebrow{font-size:6px}
.complete-mode .discovery-card strong{font-size:9px}
.complete-mode .discovery-complete{padding:6px 8px;font-size:12px;border-width:2px}
.complete-mode .discovery-complete .spark{font-size:16px}
.complete-mode .lab{
  flex:1 1 auto;height:auto;min-height:180px;max-height:none;margin:5px 0 0
}
.complete-mode .beaker{
  width:clamp(126px,34vw,160px);height:clamp(138px,22dvh,180px);bottom:10px
}
.complete-mode .co2-tank{
  width:clamp(48px,14vw,62px);height:clamp(82px,14dvh,110px);left:12px;bottom:12px
}
.complete-mode .co2-valve-btn{display:none}
.complete-mode .valve-hint,.complete-mode .flow-label{display:none}
.complete-mode .co2-tank:before{top:27px;font-size:12px;left:6px;right:6px}
.complete-mode .hose{left:54px;bottom:52px;width:70px;height:45px;border-left-width:5px;border-bottom-width:5px}
.complete-mode .cloud-meter{left:65px;right:8px;top:7px;padding:4px 6px}
.complete-mode .cloud-meter .row{font-size:8px}
.complete-mode .track{height:8px;margin-top:2px}
.complete-mode .white-label{font-size:8px;padding:4px 6px}
.complete-mode .coral-bg{font-size:30px;bottom:34px}
.complete-mode .cloud{display:none}

.complete-actions{
  position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,480px);
  padding:10px 12px calc(12px + var(--safe));
  background:linear-gradient(180deg,#fff7cfef,#ffd95af5);
  border-top:3px solid #fff;box-shadow:0 -6px 18px rgba(31,88,108,.20)
}
.complete-actions .big-btn{
  max-width:none;min-height:58px;font-size:18px;
  animation:completeCta 1.2s ease-in-out infinite
}
@keyframes completeCta{50%{transform:translateY(-2px) scale(1.015)}}
.pump-btn,.observe-btn,.reset-btn{
  min-height:65px;border:0;border-radius:20px;font-weight:1000;box-shadow:0 4px #063c52;
}
.pump-btn{background:#fff;color:#0a6688;font-size:16px}
.pump-btn.active{background:var(--yellow);transform:translateY(2px)}
.instrument-controls{grid-template-columns:1.15fr .85fr}
.instrument-guide{
  min-height:65px;border-radius:20px;background:#fff;color:#0a6688;font-size:12px;font-weight:1000;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 4px #063c52
}
.observe-btn{
  background:var(--red);color:#fff;font-size:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:7px 8px
}
.observe-btn .observe-main{font-size:15px;line-height:1.05}
.observe-btn .observe-sub{font-size:8px;line-height:1.1;opacity:.92}
.observe-btn.ready{background:#e85a43;animation:observePulse .85s ease-in-out infinite}
@keyframes observePulse{50%{transform:translateY(-1px) scale(1.025);box-shadow:0 5px #063c52,0 0 0 4px #ffd95a88}}
.reset-btn{grid-column:1/-1;min-height:38px;background:#ffffff33;color:#fff;box-shadow:none;font-size:12px}
.discovery{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.discovery-card{
  min-width:0;min-height:46px;border-radius:14px;padding:6px 7px;
  background:#edf7fa;border:2px solid #cfe5eb;color:#57727b;
  display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;
  box-shadow:0 3px rgba(26,93,115,.10);transition:.2s ease
}
.discovery-card .mark{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:#d8e9ee;font-size:14px;filter:grayscale(.6);opacity:.7
}
.discovery-card .copy{min-width:0}
.discovery-card .eyebrow{display:block;font-size:7px;line-height:1.05;font-weight:1000;letter-spacing:.07em;color:#77909a}
.discovery-card strong{display:block;margin-top:1px;font-size:10px;line-height:1.15;font-weight:1000;overflow-wrap:anywhere}
.discovery-card.got{
  background:#fff7c9;border-color:#ffd95a;color:#6f5212;
  box-shadow:0 3px #ddb43d,0 0 0 2px #fff inset;transform:translateY(-1px)
}
.discovery-card.got .mark{background:#ffd95a;filter:none;opacity:1;animation:discoverPop .45s ease-out}
.discovery-card.got .eyebrow{color:#98751c}
.discovery-complete{
  grid-column:1/-1;border-radius:18px;padding:10px 12px;
  background:linear-gradient(90deg,#fff0a8,#ffd95a,#fff0a8);
  color:#684710;border:3px solid #fff;box-shadow:0 4px #c99b28,0 0 18px #ffd95a88;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:14px;font-weight:1000;letter-spacing:.02em;animation:completePop .55s cubic-bezier(.2,1.4,.4,1)
}
.discovery-complete .spark{font-size:21px}
@keyframes discoverPop{0%{transform:scale(.6) rotate(-8deg)}70%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1)}}
@keyframes completePop{0%{opacity:0;transform:scale(.82)}100%{opacity:1;transform:scale(1)}}
.bridge-screen{padding:14px 12px 26px;overflow:auto}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px rgba(26,93,115,.14);margin-bottom:10px}
.card h2{font-size:20px;margin:0 0 7px;color:#0a5d7d}
.card p{font-size:12px;line-height:1.65;margin:6px 0;color:#41636e}
.timeline{height:220px;border-radius:20px;background:linear-gradient(#7ed5ec 0 55%,#dfcf9f 55% 100%);position:relative;overflow:hidden;margin:10px 0}
.reef{position:absolute;left:0;right:0;bottom:50px;text-align:center;font-size:52px;transform:translateY(calc(var(--time,0) * -0.18px));transition:.15s}
.sediment{position:absolute;left:12%;right:12%;bottom:26px;height:calc(8px + var(--time,0) * .72px);max-height:88px;background:repeating-linear-gradient(180deg,#ece8dc 0 7px,#c9c2ad 7px 14px);border-radius:12px 12px 0 0;transition:.15s;opacity:calc(.3 + var(--time,0) / 140)}
.rock-label{position:absolute;right:8px;bottom:7px;background:#fffdf0;color:#6e634d;border-radius:12px;padding:5px 7px;font-size:9px;font-weight:900}
.time-badge{
  position:absolute;z-index:6;right:8px;top:8px;width:min(58%,210px);
  background:#ffffffed;border:2px solid #fff;border-radius:16px;padding:7px 9px;
  box-shadow:0 3px 10px rgba(20,77,96,.18);color:#164f63
}
.time-badge .era{display:block;font-size:9px;font-weight:1000;color:#8a5b18;letter-spacing:.05em}
.time-badge strong{display:block;font-size:15px;line-height:1.15;margin:2px 0;color:#0a5d7d}
.time-badge small{display:block;font-size:9px;line-height:1.25;font-weight:800;color:#466875}
.time-note{font-size:9px;line-height:1.35;color:#63777e;margin:4px 0 0}
.time-control{
  position:relative;margin-top:6px;background:#f2fbfd;border:2px solid #bfe6ef;border-radius:16px;padding:9px 10px 8px
}
.time-control.first-touch{
  background:#fff8cf;border-color:#ffd95a;box-shadow:0 0 0 4px #ffd95a33
}
.slider-hint{
  position:absolute;z-index:5;left:14px;top:54px;
  background:#ffd95a;color:#6a4b10;border:2px solid #fff;border-radius:14px;
  padding:6px 9px;font-size:10px;font-weight:1000;box-shadow:0 3px rgba(90,63,10,.18);
  animation:sliderHint 1s ease-in-out infinite;pointer-events:none
}
.slider-hint:after{
  content:"";position:absolute;left:18px;top:-8px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:8px solid #ffd95a
}
@keyframes sliderHint{50%{transform:translateX(5px)}}
.time-control-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;
  font-size:11px;font-weight:1000;color:#0a5d7d
}
.time-control-head strong{font-size:12px;color:#8a5b18}
.time-range{width:100%;accent-color:#0b6e8f;height:38px}
.time-marks{
  display:flex;justify-content:space-between;font-size:8px;font-weight:900;color:#69818a;margin-top:-4px
}
.time-progress{
  margin-top:5px;border-radius:12px;padding:6px 8px;text-align:center;
  background:#fff7cf;color:#735313;font-size:10px;font-weight:1000
}
.time-progress.done{background:#e4f8e8;color:#26633b}
.unlock{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#fff7cf;border-radius:17px;padding:11px;margin-top:10px}
.unlock .ico{font-size:48px}
.unlock strong{font-size:13px;color:#7b5a16}.unlock p{font-size:11px;margin:3px 0 0;line-height:1.45;color:#6b634f}
.summary-unlock{align-items:start;background:#fffdf2;animation:completePop .45s ease-out}
.summary-unlock .ico{font-size:42px}
.summary-report-btn{margin-top:8px;max-width:none;padding:11px 14px;font-size:16px}
.finish-screen{padding:16px 12px 28px;text-align:center;overflow:auto}
.finish-screen h2{font-size:28px;margin:6px 0;color:#0a5d7d}
.medal{font-size:78px;animation:bob 1.5s ease-in-out infinite}
.summary{text-align:left;background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 4px rgba(26,93,115,.14)}
.summary h3{font-size:15px;margin:0 0 6px;color:#0a5d7d}.summary li{font-size:12px;line-height:1.55;margin:4px 0}
.sources{text-align:left;font-size:10px;line-height:1.55;color:#536a72;margin-top:12px}
.sources a{color:#075b7c;text-decoration:underline}
.mute{
  position:absolute;z-index:40;right:10px;top:calc(10px + env(safe-area-inset-top,0px));
  min-width:54px;min-height:34px;border:0;border-radius:18px;background:#fff;color:#0a5d7d;font-size:12px;font-weight:1000
}
@keyframes rise{to{transform:translateY(-150px);opacity:0}}
@keyframes drift{to{transform:translate(8px,-7px) scale(1.2)}}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes happy{50%{transform:scale(1.12) rotate(-4deg)}}
@keyframes valve{50%{transform:rotate(18deg) scale(1.08)}}
@keyframes float{to{transform:translateX(65px)}}
@media(max-width:350px){
  .top{min-height:116px}.score{font-size:30px}.nextbubble{min-width:66px;height:44px}
  .play-screen{padding-left:7px;padding-right:7px}.lab{min-height:165px}.beaker{width:150px;height:158px}
  .co2-tank{width:62px;height:108px}.cloud-meter{left:82px}.shisa-face{font-size:40px}
}
@media(max-height:760px){
  .complete-mode .mission{display:none}
  .complete-mode .reaction{min-height:30px}
  .complete-mode .discovery-complete{padding:5px 7px}
  .complete-mode .lab{flex:1 1 auto;height:auto;min-height:170px;max-height:none}
  .complete-mode .beaker{width:clamp(118px,32vw,150px);height:clamp(128px,21dvh,165px)}
  .complete-mode .co2-tank{width:clamp(46px,13vw,58px);height:clamp(78px,13dvh,102px)}
}
@media(max-height:650px){
  .top{min-height:110px;padding-top:calc(6px + env(safe-area-inset-top,0px))}.score{font-size:29px}
  .progress-row{margin-top:5px}.play-screen{padding-top:6px}.mission{padding:7px 9px}.mission p{display:none}
  .lab{height:calc(100dvh - 405px);min-height:155px;margin:4px 0}.reaction{min-height:36px;padding:5px 8px;font-size:10px}
  .status-panel{margin-top:4px}.discovery{gap:4px;margin-top:4px}.discovery-card{min-height:40px;padding:4px 6px}.discovery-card .mark{width:24px;height:24px;font-size:12px}.discovery-card{grid-template-columns:24px 1fr}.discovery-card strong{font-size:9px}.discovery-card .eyebrow{font-size:6px}
  .beaker{width:142px;height:148px}.co2-tank{width:56px;height:92px}.hose{left:62px;bottom:66px;width:78px;height:58px}.cloud-meter{left:72px;top:8px;padding:5px 6px}
  .pump-btn,.observe-btn{min-height:57px}.title-screen{padding-top:16px}.shisa-big{font-size:76px}
}
@media(orientation:landscape) and (max-height:500px){
  .game-shell{width:min(100vw,680px)}.top{min-height:82px;padding:5px 10px}.brand{font-size:8px}.score{font-size:24px}
  .progress-row{position:absolute;left:130px;right:95px;bottom:6px;margin:0}.hud{grid-template-columns:120px 1fr}
  .play-screen{padding:6px 8px 75px}.mission{position:absolute;z-index:10;left:8px;top:88px;width:230px}.mission p{display:none}
  .lab{height:calc(100dvh - 96px);min-height:220px;margin:0}.reaction{position:absolute;z-index:12;left:245px;right:8px;top:92px}
  .controls{width:min(100vw,680px);grid-template-columns:1fr 1fr;padding:5px 8px calc(6px + var(--safe))}
  .pump-btn,.observe-btn{min-height:52px}.reset-btn{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useRef,useState}=React;

const clamp=(v,min=0,max=100)=>Math.max(min,Math.min(max,v));
const cloudFromDose=(dose)=>{
  if(dose<=52)return Math.min(1,dose/52);
  return Math.max(0,1-(dose-52)/48);
};
const messageFor=(dose)=>{
  if(dose<15)return "まだほとんど透明。泡の動きを見てみよう。";
  if(dose<38)return "少しずつ白い粒が見えてきた！";
  if(dose<=68)return "白くにごっている！ いまが観察チャンス。";
  if(dose<88)return "あれ？ 白さが少しずつ消えてきた…";
  return "たくさん入れたら、また透明に近づいた！";
};

function useAudio(){
  const ctxRef=useRef(null),masterRef=useRef(null),bgmTimer=useRef(null),step=useRef(0),mutedRef=useRef(false);
  const [muted,setMuted]=useState(false);
  useEffect(()=>{mutedRef.current=muted;if(masterRef.current)masterRef.current.gain.value=muted?0:0.22},[muted]);
  const ensure=async()=>{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return false;
    if(!ctxRef.current||ctxRef.current.state==="closed"){
      ctxRef.current=new C({latencyHint:"interactive"});
      masterRef.current=ctxRef.current.createGain();
      masterRef.current.gain.value=mutedRef.current?0:0.22;
      masterRef.current.connect(ctxRef.current.destination);
    }
    if(ctxRef.current.state==="suspended"||ctxRef.current.state==="interrupted"){
      try{await ctxRef.current.resume()}catch(e){}
    }
    try{if("audioSession" in navigator)navigator.audioSession.type="playback"}catch(e){}
    return ctxRef.current.state==="running";
  };
  const tone=async(freq=440,dur=.09,type="sine",gain=.18)=>{
    if(!(await ensure())||mutedRef.current)return;
    const c=ctxRef.current,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g);g.connect(masterRef.current);o.start();o.stop(c.currentTime+dur);
  };
  const chord=async(notes=[523,659,784],gap=.08)=>{
    for(let i=0;i<notes.length;i++)setTimeout(()=>tone(notes[i],.17,"sine",.13),i*gap*1000);
  };
  const startBgm=async()=>{
    if(!(await ensure())||bgmTimer.current)return;
    const notes=[262,330,392,330,294,349,440,349];
    bgmTimer.current=setInterval(()=>{if(!mutedRef.current)tone(notes[step.current++%notes.length],.16,"sine",.035)},520);
  };
  const stopBgm=()=>{if(bgmTimer.current){clearInterval(bgmTimer.current);bgmTimer.current=null}};
  useEffect(()=>{
    const recover=()=>ensure();
    document.addEventListener("visibilitychange",recover);
    window.addEventListener("pageshow",recover);
    return()=>{document.removeEventListener("visibilitychange",recover);window.removeEventListener("pageshow",recover);stopBgm()};
  },[]);
  return{muted,setMuted,tone,chord,startBgm,ensure};
}

function App(){
  const audio=useAudio();
  const [screen,setScreen]=useState("title");
  const [dose,setDose]=useState(0);
  const [score,setScore]=useState(0);
  const [best,setBest]=useState(()=>{try{return +(localStorage.getItem("limestone_lab_best")||0)}catch(e){return 0}});
  const [foundCloud,setFoundCloud]=useState(false);
  const [foundClear,setFoundClear]=useState(false);
  const [reaction,setReaction]=useState("CO₂を送って、石灰水の変化を見てみよう。");
  const [reactionKind,setReactionKind]=useState("");
  const [pumping,setPumping]=useState(false);
  const [bubbleSeed,setBubbleSeed]=useState(0);
  const [time,setTime]=useState(0);
  const [bridgeDone,setBridgeDone]=useState(false);
  const pumpTimer=useRef(null);
  const cloud=cloudFromDose(dose);

  useEffect(()=>{try{localStorage.setItem("limestone_lab_best",String(best))}catch(e){}},[best]);

  const stage = screen==="title" ? 0 : screen==="play" ? (foundCloud?2:1) : screen==="bridge" ? 3 : 3;
  const nextLabel = !foundCloud ? "白いにごり" : !foundClear ? "透明にもどる?" : screen==="play" ? "沖縄へ!" : screen==="bridge" ? "石灰岩" : "👑";
  const nextSub = !foundCloud ? "見つけよう" : !foundClear ? "入れつづける" : screen==="play" ? "発見2/2" : screen==="bridge" ? Math.max(0,100-time)+"%" : "MAX";

  const timeInfo = time < 22
    ? {era:"第四紀・更新世前期", when:"約130万年前ごろ", hook:"沖縄島南部で、古いサンゴ礁の記録が残るころ"}
    : time < 68
      ? {era:"第四紀・更新世", when:"数十万年前", hook:"サンゴ礁の生き物の骨格や殻が、海の底に積もっていく"}
      : time < 96
        ? {era:"第四紀・更新世", when:"長い時間がたつ", hook:"石灰質の堆積物が重なり、岩として残っていく"}
        : {era:"現在", when:"いまの沖縄", hook:"昔の海の記憶が、琉球石灰岩として地上に見えている"};

  const startGame=async()=>{
    await audio.ensure();audio.tone(660,.09);audio.startBgm();
    setScreen("play");setDose(0);setFoundCloud(false);setFoundClear(false);setScore(0);
    setReaction("まずはCO₂を少しずつ送ろう。白さが変わるよ。");setReactionKind("");
  };

  const pumpOnce=()=>{
    setDose(d=>clamp(d+2.6));
    setBubbleSeed(s=>s+1);
    audio.tone(220,.055,"sine",.07);
  };
  const startPump=()=>{
    if(pumping)return;
    setPumping(true);pumpOnce();
    pumpTimer.current=setInterval(pumpOnce,125);
  };
  const stopPump=()=>{
    setPumping(false);
    if(pumpTimer.current){clearInterval(pumpTimer.current);pumpTimer.current=null}
  };
  useEffect(()=>()=>stopPump(),[]);

  const observe=()=>{
    stopPump();
    if(dose<28){
      setReaction("まだ早いみたい。白い粒がもっと見えるまで、少しCO₂を送ろう。");
      setReactionKind("warn");audio.tone(260,.12,"triangle",.12);return;
    }
    if(dose<=68){
      const bonus=Math.max(25,Math.round(100-Math.abs(dose-52)*2.5));
      if(!foundCloud){
        setFoundCloud(true);setScore(s=>s+bonus);setBest(b=>Math.max(b,score+bonus));
        setReaction("発見！ 石灰水が白くにごった。白い粒の正体は炭酸カルシウム。");
        setReactionKind("good");audio.chord([523,659,784,1047],.07);
      }else{
        setReaction("白いにごりをもう一度確認できた。次は、このままCO₂を入れ続けてみよう。");
        setReactionKind("good");audio.tone(700,.13,"sine",.12);
      }
      return;
    }
    if(dose>=86){
      if(!foundClear){
        setFoundClear(true);setScore(s=>s+100);setBest(b=>Math.max(b,score+100));
        setReaction("大発見！ CO₂をさらに入れると、白いにごりが消えて透明に近づいた！");
        setReactionKind("good");audio.chord([659,784,988,1319],.08);
      }else{
        setReaction("透明にもどる変化を確認できた。2つの発見がそろった！");
        setReactionKind("good");
      }
      return;
    }
    setReaction("白さが消えはじめている。もっと入れると、どうなるかな？");
    setReactionKind("warn");audio.tone(440,.1,"triangle",.1);
  };

  const resetTrial=()=>{
    stopPump();setDose(0);setReaction("発見は残したまま、石灰水だけ最初の状態に戻したよ。");setReactionKind("");
    audio.tone(330,.1,"sine",.09);
  };

  const goBridge=()=>{audio.chord([523,659,784],.08);setScreen("bridge");setTime(0);setBridgeDone(false)};

  const updateTime=(v)=>{
    const n=+v;setTime(n);
    if(n>=100&&!bridgeDone){
      setBridgeDone(true);setScore(s=>s+100);audio.chord([523,659,784,1047],.08);
    }
  };

  const finish=()=>{
    const final=score+(bridgeDone?0:100);setBest(b=>Math.max(b,final));setScreen("finish");audio.chord([523,659,784,1047,1319],.1);
  };

  const particles=Array.from({length:22},(_,i)=>({x:(i*37)%95,y:(i*53)%90,t:1.4+(i%5)*.3}));
  const bubbles=Array.from({length:Math.min(8,Math.floor(dose/10)+1)},(_,i)=>({x:20+((bubbleSeed+i*17)%65),t:1.1+(i%4)*.18}));

  return <div className="game-shell">
    <header className="top">
      <div className="brand">アルパカすく〜る 🦙『にごりラボ！』</div>
      <div className="hud">
        <div className="scorebox"><div className="lbl">DISCOVERY SCORE</div><div className="score">{String(score).padStart(3,"0")}</div></div>
        <div className="nextbox"><div className="nextbubble">{nextLabel}</div><div className="nexttext"><span className="lbl">NEXT</span><br/>{nextSub}</div></div>
      </div>
      <div className="progress-row">
        <div className={"progress-chip "+(stage>=1?"on":"")}>① にごり</div>
        <div className={"progress-chip "+(stage>=2?"on":"")}>② 入れすぎ</div>
        <div className={"progress-chip "+(stage>=3?"on":"")}>③ 沖縄へ</div>
      </div>
    </header>

    <button className="mute" onClick={()=>{audio.setMuted(!audio.muted);audio.ensure()}}>{audio.muted?"🔇 OFF":"🔊 ON"}</button>

    <section className={"screen title-screen "+(screen==="title"?"active":"")}>
      <div className="title-badge">小学3〜6年生｜理科 × 沖縄</div>
      <div className="shisa-big">🦁</div>
      <h1>シーサー研究員の<br/><em>にごりラボ！</em></h1>
      <p className="lead">CO₂を送ると、透明な石灰水はどう変わる？<br/>いちばん白くなる瞬間を、自分の目で見つけよう。</p>
      <button className="start-btn" onClick={startGame}>実験スタート！</button>
      <p className="safety-note">これは画面上の学習シミュレーションです。実際の石灰水は水酸化カルシウム水溶液なので、学校などで実験するときは先生の指示に従ってください。</p>
    </section>

    <section className={"screen play-screen "+(screen==="play"?"active ":"")+(foundCloud&&foundClear?"complete-mode":"")}>
      <div className="mission">
        <div className={"shisa-face "+((foundCloud||foundClear)?"happy":"")}>🦁</div>
        <div>
          <h2>{!foundCloud?"白いにごりを見つけよう":!foundClear?"そのまま入れ続けると？":"2つの発見がそろった！"}</h2>
          <p>{!foundCloud?"押しっぱなしでCO₂を送れるよ。白さをよく見て「ここだ！」で観察。":!foundClear?"白くなったあともCO₂を送り続けて、変化を観察しよう。":"沖縄の琉球石灰岩と、どうつながるか見に行こう。"}</p>
        </div>
      </div>

      <div className="status-panel">
        <div className={"reaction "+reactionKind}>{reaction}</div>
        <div className="discovery" aria-label="発見コレクション">
          <div className={"discovery-card "+(foundCloud?"got":"")}>
            <span className="mark">{foundCloud?"✓":"1"}</span>
            <span className="copy"><span className="eyebrow">{foundCloud?"発見した！":"発見 1"}</span><strong>白くにごる</strong></span>
          </div>
          <div className={"discovery-card "+(foundClear?"got":"")}>
            <span className="mark">{foundClear?"✓":"2"}</span>
            <span className="copy"><span className="eyebrow">{foundClear?"発見した！":"発見 2"}</span><strong>入れすぎると透明へ</strong></span>
          </div>
          {foundCloud&&foundClear&&<div className="discovery-complete" role="status"><span className="spark">✨</span><span>2つの発見 コンプリート！</span><span className="spark">✨</span></div>}
        </div>
      </div>

      <div className="lab">
        <div className="cloud"></div><div className="coral-bg">🪸🐚</div>
        <div className="cloud-meter"><div className="row"><span>白いにごり</span><b>{Math.round(cloud*100)}%</b></div><div className="track"><span style={{width:(cloud*100)+"%"}}></span></div></div>
        <div className={"co2-tank "+(pumping?"pumping":"")}>
          <button
            className={"co2-valve-btn "+(pumping?"active":"")}
            aria-label="CO₂ボトルの赤いバルブを押して二酸化炭素を送る"
            onPointerDown={startPump}
            onPointerUp={stopPump}
            onPointerCancel={stopPump}
            onPointerLeave={stopPump}
          ><span className="valve"></span></button>
        </div>
        {!pumping&&<div className="valve-hint">👆 赤いバルブを<br/>長押し！</div>}
        {pumping&&<div className="flow-label">💨 CO₂注入中！</div>}
        <div className="hose"></div>
        <div className="beaker">
          <div className="white-label">石灰水</div>
          <div className="liquid">
            <div className="cloudiness" style={{opacity:(cloud*.88)}}></div>
            {particles.map((p,i)=><i key={i} className="particle" style={{"--x":p.x+"%","--y":p.y+"%","--t":p.t+"s",opacity:cloud*.95}}></i>)}
            {pumping&&bubbles.map((b,i)=><i key={i+"-"+bubbleSeed} className="bubble" style={{"--x":b.x+"%","--t":b.t+"s"}}></i>)}
          </div>
        </div>
      </div>

      {foundCloud&&foundClear
        ? <div className="complete-actions"><button className="big-btn" onClick={goBridge}>🪨 沖縄の石灰岩へ！</button></div>
        : <div className="controls instrument-controls">
            <div className="instrument-guide">👆 ボトルの赤いバルブを長押し</div>
            <button className={"observe-btn "+((dose>=28&&dose<=68)||(dose>=86)?"ready":"")} onClick={observe}>
  <span className="observe-main">👀 観察する！</span>
  <span className="observe-sub">{(dose>=28&&dose<=68)?"今、白さをチェック":dose>=86?"今、透明さをチェック":"変化したら押そう"}</span>
</button>
            <button className="reset-btn" onClick={resetTrial}>↩ 石灰水だけ最初に戻す（発見は残る）</button>
          </div>}
    </section>

    <section className={"screen bridge-screen "+(screen==="bridge"?"active":"")}>
      <div className="card">
        <h2>🪸 海の世界から、沖縄の岩へ</h2>
        <p>琉球石灰岩は、昔のサンゴ礁をつくった生き物の骨格や殻などを含む【サンゴ礁複合体の堆積物】が、長い時間をかけて積み重なり固まったものだよ。サンゴだけでできているわけではないよ。</p>
        <div className="timeline" style={{"--time":time}}>
          <div className="time-badge" aria-live="polite">
            <span className="era">{timeInfo.era}</span>
            <strong>{timeInfo.when}</strong>
            <small>{timeInfo.hook}</small>
          </div>
          <div className="reef">🪸 🐚 🪸 🐚 🪸</div>
          <div className="sediment"></div>
          <div className="rock-label">琉球石灰岩へ</div>
        </div>
        <div className={"time-control "+(time===0?"first-touch":"")}>
          <div className="time-control-head">
            <span>⏩ このつまみで時間をすすめる</span>
            <strong>{time}%</strong>
          </div>
          {time===0&&<div className="slider-hint">👆 ここを右へ動かそう！</div>}
          <input className="time-range" aria-label="時間をすすめる" type="range" min="0" max="100" value={time} onChange={e=>updateTime(e.target.value)} />
          <div className="time-marks"><span>0%</span><span>50%</span><span>100%</span></div>
          <div className={"time-progress "+(bridgeDone?"done":"")}>
            {bridgeDone?"✅ 100%到達！ 石灰岩の発見へ":"あと "+Math.max(0,100-time)+"% → 100%で発見！"}
          </div>
        </div>
        <p className="time-note">※このスライダーは地質の変化をイメージする時間旅行。目盛りは実際の年数に比例していません。</p>
        {!bridgeDone
          ? <div className="unlock">
              <div className="ico">⏳</div>
              <div><strong>スライダーを右へ動かしてみよう</strong><p>上の時間スライダーを100%まで動かすと、次の発見がアンロックされるよ。</p></div>
            </div>
          : <div className="unlock summary-unlock">
              <div className="ico">🦁</div>
              <div>
                <strong>シーサー研究員のまとめ</strong>
                <p>沖縄の地面の下には、琉球石灰岩が広く見られる場所がある。石灰岩は石垣や石材にも使われてきた。今日の実験で見えた「炭酸カルシウム」を手がかりに、海と陸がつながって見えてくるね。</p>
                <button className="big-btn summary-report-btn" onClick={finish}>👑 研究レポートを見る</button>
              </div>
            </div>}
      </div>}
    </section>

    <section className={"screen finish-screen "+(screen==="finish"?"active":"")}>
      <div className="medal">🏅</div>
      <h2>にごり博士 認定！</h2>
      <p style={{fontWeight:900,color:"#426773"}}>BEST {String(best).padStart(3,"0")} POINT</p>
      <div className="summary">
        <h3>今日の3つの発見</h3>
        <ul>
          <li>石灰水に二酸化炭素を通すと、炭酸カルシウムができて白くにごる。</li>
          <li>二酸化炭素をさらに多く通し続けると、水に溶けやすい炭酸水素カルシウムになり、透明に近づく。</li>
          <li>沖縄の「琉球石灰岩」は、昔のサンゴ礁複合体の堆積物が長い時間をかけてできた石灰岩で、炭酸カルシウムを主成分とする。</li>
        </ul>
      </div>
      <button className="big-btn" onClick={()=>{setScreen("title");setDose(0);setScore(0);setFoundCloud(false);setFoundClear(false);setTime(0);setBridgeDone(false)}}>もう一度あそぶ</button>
      <div className="sources">
        <strong>📚 出典・参考文献</strong><br/>
        ・<a href="https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2012/01/12/1304649_25_1.pdf" target="_blank" rel="noopener noreferrer">文部科学省「小学校理科の観察，実験の手引き 第6学年 水溶液の性質」</a><br/>
        ・<a href="https://www.edu-c.pref.miyagi.jp/midori/science/jugyo-sien/jugyouan/pointo2011/sinpoint/pointpdf/ALL2016.pdf" target="_blank" rel="noopener noreferrer">宮城県総合教育センター「みやぎ理科指導ポイント集」</a><br/>
        ・<a href="https://www.gsj.jp/Muse/prefrock/index.html" target="_blank" rel="noopener noreferrer">産総研 地質調査総合センター「県の石｜沖縄県：琉球石灰岩」</a>
      </div>
    </section>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
