<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ハーリーのちいさな暮らし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d0a07;overflow:hidden;
    font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#fff7e0}
  body{display:flex;align-items:center;justify-content:center}
  #root{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .stage{position:relative;width:100%;height:100%;max-width:calc(100vh*0.5625);overflow:hidden;container-type:size;background:#e9d7ad;
    user-select:none;-webkit-user-select:none}
  .stage>div:first-child{position:absolute;inset:0}
  canvas{display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 62%,rgba(30,15,0,.1) 100%)}
  .daybar{position:absolute;top:2.2%;left:0;right:0;display:flex;justify-content:center;gap:2%;pointer-events:none}
  .chip{padding:.35em .8em;font-size:3.4cqw;border:2px solid #3a2a1a;background:#fff2cf;color:#3a2a1a}
  .chip{font:inherit;font-size:3.4cqw}
  .chip.off{background:#b9ad92;color:#7a6e58;border-color:#6b5f48}
  .chip.done{background:#8d7f62;color:#d9cdb0;border-color:#5a4f3a}
  .chip.next{background:#ffd23c;color:#3a2a1a;pointer-events:auto;cursor:pointer;animation:pulse .9s ease-in-out infinite}
  .daybar{pointer-events:none}
  @keyframes pulse{50%{transform:scale(1.1)}}
  .mute{position:absolute;top:1.8%;right:2.5cqw;font-size:5.5cqw;background:rgba(255,242,207,.85);border:2px solid #3a2a1a;padding:.1em .3em;cursor:pointer;line-height:1}
  .card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    background:rgba(10,8,30,.55);animation:cardfade 1.9s ease-in-out forwards}
  .card span{font-size:12cqw;color:#fff4d0;text-shadow:3px 3px 0 #5a2e12,-2px -2px 0 #5a2e12,2px -2px 0 #5a2e12,-2px 2px 0 #5a2e12}
  @keyframes cardfade{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
  .btn.adv{font-size:4.2cqw;padding:.45em 1.2em;background:#e0a21c;color:#2a1a08;outline-color:#5a2e12;animation:pulse .9s ease-in-out infinite}
  .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 3cqw 3cqw;pointer-events:none}
  .msgbox{pointer-events:auto;min-height:0;background:rgba(24,16,40,.88);border:3px solid #f4e8c8;
    outline:2px solid #1a1226;padding:2.5cqw 3.5cqw;font-size:3.7cqw;line-height:1.55;position:relative}
  .msgtext{white-space:pre-wrap;min-height:3.1em}
  .hint{text-align:right;color:#ffd23c;font-size:.8em;animation:blink 1s steps(2) infinite}
  .end{margin-top:.5em;display:flex;align-items:center;justify-content:space-between;gap:.5em;font-size:.85em;color:#ffd23c}
  @keyframes blink{50%{opacity:0}}
  .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;
    background:linear-gradient(rgba(20,10,0,.25),rgba(20,10,0,.05) 40%,rgba(20,10,0,.45));text-align:center;padding:0 6%}
  .title h1{margin:0;font-weight:400;font-size:10cqw;line-height:1.3;color:#fff4d0;
    text-shadow:3px 3px 0 #5a2e12,-2px -2px 0 #5a2e12,2px -2px 0 #5a2e12,-2px 2px 0 #5a2e12}
  .title-sub{font-size:3.8cqw;color:#fff4d0;text-shadow:2px 2px 0 #5a2e12}
  .title-foot{font-size:3.2cqw;color:#fff4d0;text-shadow:2px 2px 0 #5a2e12;margin-top:2cqw}
  .btn{font:inherit;font-size:5cqw;padding:.55em 1.8em;background:#c8553d;color:#fff4d0;
    border:3px solid #fff4d0;outline:3px solid #5a2e12;cursor:pointer}
  .btn:active{transform:translateY(2px)}
  .btn.small{font-size:1em;padding:.3em 1em}
</style>
</head>
<body>
<div id="root"></div>
