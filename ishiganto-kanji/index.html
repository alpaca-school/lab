<div style="max-width:980px;margin:8px auto 0;padding:0 10px"><a class="lab-inline-home" href="https://lab.alpaca-school.okinawa/">← 🔬 ラボ一覧</a></div><main><h1>🪨 石敢當職人！ マジムンから村を守れ</h1><p class="sub">正しい漢字を彫って、T字路の突き当たりに設置しよう！</p><section class="hud2"><div class="scoreRow"><div><small>🏆 職人スコア</small><strong id="score2">0000</strong><small id="best2">BEST 0000</small></div><div><small>⚒️ 成長する村</small><strong id="combo2" style="font-size:16px">連続成功 0</strong><small id="stageNext">NEXT あと 5基</small></div></div><div class="growthList" id="stageIcons"><span class="on">🏡</span><span>🌱</span><span>🌺</span><span>🏮</span><span>✨</span></div><div class="progress2"><i id="growth2"></i></div></section><div class="meters"><div class="meter"><div class="mrow"><span>🏠 村の守り</span><span id="hp">100%</span></div><div class="track"><div id="hpbar" class="fill"></div></div></div><div class="meter"><div class="mrow"><span>👻 接近まで</span><span id="clock">12秒</span></div><div class="track"><div id="timebar" class="fill" style="background:#ca8c56"></div></div></div></div><div id="scene2" class="scene"><div class="tag" id="round">第1波 / 5</div><div id="stone" class="stone">石敢當</div><div id="ghost" class="ghost">👻</div><div id="fx" class="fx">✨</div><div id="vflowers" class="villageAdd">🌺🌿</div><div id="vlantern" class="villageAdd">🏮✨</div><div id="vpeople" class="villageAdd">👨‍👩‍👧‍👦</div><div id="shield2"></div><div id="boom" class="boom"></div></div><div class="modeBar"><label for="difficulty">ゲームの速さ</label><select id="difficulty"><option value="easy">ゆっくり・18秒</option><option value="normal" selected>ふつう・12秒</option><option value="hard">むずかしい・9秒</option></select><button id="mute2" class="mute2" aria-pressed="false">🔇 音OFF</button></div><div class="panel"><strong>正しい漢字を選んで「カン！」と彫ろう</strong><div id="slots" class="slots"></div><div id="answers" class="answers"></div><button id="place" class="place" disabled>🪨 T字路に石敢當を設置する！</button></div><div id="msg" class="msg" role="status" aria-live="polite">「ゲーム開始」を押してね！</div><div class="buttons"><button id="start" class="start">▶ ゲーム開始</button><button id="again" class="again">↻ 最初から</button><a class="lab-result-home" href="https://lab.alpaca-school.okinawa/">← ラボ一覧に戻る</a></div><p class="note">架空の集落を描いたゲームです。石敢當は実際には道の突き当たりや塀などに据えられるものとして伝えられています。マジムンは伝承上の存在です。実物の石敢當を動かしたり削ったりしないでね。</p></main><script>
(()=>{"use strict";
const $=id=>document.getElementById(id),rounds=[{gap:1,opts:['取','敢','岩']},{gap:0,opts:['岩','石','右']},{gap:2,opts:['島','當','塔']},{gap:1,opts:['敢','攻','取']},{gap:2,opts:['堂','富','當']}],target='石敢當';
let index=0,hp=100,remaining=12,playing=false,state='idle',score=0,combo=0,wins=0,raf=0,last=0,seq=0,mode='normal',muted=true,audio=null,bgm=null,best=0;const duration={easy:18,normal:12,hard:9};
try{best=Number(localStorage.getItem('ishiganto_best_v3'))||0}catch(_){}
function sound(type){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume().catch(()=>{});const t=audio.currentTime;
function tone(freq,length=.12,kind='triangle',vol=.034,delay=0,end=freq){const o=audio.createOscillator(),g=audio.createGain();o.type=kind;o.frequency.setValueAtTime(freq,t+delay);o.frequency.exponentialRampToValueAtTime(Math.max(35,end),t+delay+length);g.gain.setValueAtTime(.001,t+delay);g.gain.exponentialRampToValueAtTime(vol,t+delay+.01);g.gain.exponentialRampToValueAtTime(.001,t+delay+length);o.connect(g);g.connect(audio.destination);o.start(t+delay);o.stop(t+delay+length+.02)}
if(type==='chisel'){tone(850,.08,'square',.025,0,210);tone(460,.12,'triangle',.028,.025,130)}if(type==='wrong')tone(230,.24,'sawtooth',.025,0,85);if(type==='defend'){tone(360,.26,'sine',.04,0,780);tone(670,.4,'triangle',.035,.15,1030)}if(type==='damage')tone(210,.43,'sawtooth',.044,0,55);if(type==='level'){tone(490,.12);tone(650,.17,'triangle',.04,.12);tone(840,.26,'sine',.04,.28)}if(type==='bgm')tone(220+([0,4,7,9,7,4][Math.floor(performance.now()/720)%6])*11,.22,'sine',.008);
}catch(_){}}
function music(){clearInterval(bgm);if(!muted&&playing)bgm=setInterval(()=>{if(!document.hidden)sound('bgm')},720)}
function effect(s){const e=$('boom');e.textContent=s;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function message(s){$('msg').textContent=s}
function render(){
$('round').textContent='第'+Math.min(5,index+1)+'波 / 5';$('hp').textContent=hp+'%';$('hpbar').style.width=hp+'%';$('clock').textContent=Math.ceil(Math.max(0,remaining))+'秒';$('timebar').style.width=Math.max(0,remaining/duration[mode]*100)+'%';
$('ghost').style.top=(82-(1-remaining/duration[mode])*33)+'%';$('place').disabled=state!=='ready';$('stone').classList.toggle('on',state==='placed');
$('score2').textContent=String(score).padStart(4,'0');$('best2').textContent='BEST '+String(Math.max(best,score)).padStart(4,'0');$('combo2').textContent='連続成功 '+combo+(combo>=3?' 🔥':'');$('growth2').style.width=wins/5*100+'%';
Array.from($('stageIcons').children).forEach((x,i)=>{x.classList.toggle('on',i<=wins);x.classList.toggle('current',i===Math.min(wins,4))});
$('vflowers').classList.toggle('on',wins>=2);$('vlantern').classList.toggle('on',wins>=3);$('vpeople').classList.toggle('on',wins>=4);$('scene2').classList.toggle('warm',wins>=3);$('scene2').classList.toggle('celebrate',wins>=5);
$('stageNext').textContent=wins===5?'👑 MAX':('NEXT あと '+(5-wins)+'基');}
function puzzle(){if(index>=rounds.length)return;state='choose';remaining=duration[mode];$('ghost').classList.remove('repel');$('ghost').style.opacity='1';$('ghost').textContent=['👻','🌫️','👾','👹','👻'][index];$('stone').classList.remove('on');
$('slots').replaceChildren();for(let i=0;i<3;i++){const e=document.createElement('div');e.className='slot'+(i===rounds[index].gap?' empty':'');e.textContent=i===rounds[index].gap?'？':target[i];$('slots').append(e)}
$('answers').replaceChildren();for(const letter of rounds[index].opts){const btn=document.createElement('button');btn.textContent=letter;btn.type='button';btn.onclick=()=>choose(letter,btn);$('answers').append(btn)}message('👻 マジムンが接近！漢字を選んで、石敢當を彫ろう！');render()}
function choose(letter,btn){if(state!=='choose')return;
if(letter!==target[rounds[index].gap]){remaining=Math.max(0,remaining-2);sound('wrong');btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),350);message('文字がちがう！ 見本をよく見よう。時間 -2秒');effect('ちがう字！');if(!remaining){miss();return}render();return}
state='carving';for(const b of $('answers').children)b.disabled=true;const current=seq;let count=0;message('🔨 カン、カン！石に文字を彫りこんでいる！');
function hit(){if(current!==seq||state!=='carving')return;count++;sound('chisel');effect('⚒️');if(count<3)setTimeout(hit,150);else setTimeout(()=>{if(current!==seq||state!=='carving')return;state='ready';const el=$('slots').children[rounds[index].gap];el.textContent=letter;el.classList.remove('empty');el.classList.add('carved');message('✨ 石敢當が完成！今すぐT字路に設置しよう！');render()},170)}hit()}
function moveOn(){const current=seq;setTimeout(()=>{if(current!==seq||state==='done')return;index++;if(index===5){finish(true);return}puzzle()},900)}
function defend(){if(state!=='ready')return;state='placed';combo++;wins++;const point=100+Math.round(remaining*10)+(combo>=2?combo*25:0);score+=point;try{if(score>best){best=score;localStorage.setItem('ishiganto_best_v3',String(best))}}catch(_){}
$('shield2').classList.remove('on');void $('shield2').offsetWidth;$('shield2').classList.add('on');$('ghost').classList.add('repel');sound('defend');if(wins>1)sound('level');effect('+'+point+' ✨');message('🛡️ マジムンを防いだ！ 村に花や明かりが増えていく！');render();moveOn()}
function miss(){if(!playing||state==='done'||state==='placed'||state==='miss')return;state='miss';seq++;hp=Math.max(0,hp-25);combo=0;sound('damage');effect('💥 -25%');message('マジムンが村に入った！ 守りが25%減った。');$('ghost').style.opacity='.25';render();if(hp===0){finish(false);return}moveOn()}
function finish(win){playing=false;state='done';seq++;cancelAnimationFrame(raf);clearInterval(bgm);message(win?'🎉 村を守りきった！スコア '+score+'点！ '+(wins===5?'👑 MAX！':''):'ゲームオーバー！ 村の守りが0%になった。スコア '+score+'点。');$('place').disabled=true;$('again').textContent='↻ もう一度あそぶ';$('start').classList.add('hide');render()}
function frame(t){if(!playing)return;const dt=Math.max(0,Math.min(.1,(t-last)/1000));last=t;if(state==='choose'||state==='carving'||state==='ready'){remaining=Math.max(0,remaining-dt);if(!remaining)miss()}render();raf=requestAnimationFrame(frame)}
function start(){seq++;cancelAnimationFrame(raf);clearInterval(bgm);index=0;hp=100;score=0;combo=0;wins=0;playing=true;state='choose';mode=$('difficulty').value;$('start').classList.add('hide');puzzle();last=performance.now();raf=requestAnimationFrame(frame);music()}
$('start').onclick=start;$('again').onclick=start;$('place').onclick=defend;
$('mute2').onclick=()=>{muted=!muted;$('mute2').textContent=muted?'🔇 音OFF':'🔊 音ON';$('mute2').setAttribute('aria-pressed',String(!muted));if(!muted)sound('level');music()};
$('difficulty').onchange=()=>{if(!playing){mode=$('difficulty').value;remaining=duration[mode];render()}};
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)clearInterval(bgm);else music()});window.addEventListener('pageshow',()=>{last=performance.now();music()});$('start').classList.remove('hide');render()})();
</script></body></html>
